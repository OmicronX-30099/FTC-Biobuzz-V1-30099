buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://repo.dairy.foundation/releases/' }
    }
    dependencies {
        classpath 'dev.frozenmilk:Load:0.3.2'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':FtcRobotController')
    testImplementation 'junit:junit:4.13.2'
}

// Load 0.3.2 re-merges AGP's intermediate DEX files. With AGP 9.4 this loses
// synthetic backport context in the Pedro tuners. Dex the complete Java/Kotlin
// class bundle instead, keeping Sloth's output name and deployment task.
afterEvaluate {
    def slothClasses = tasks.named('bundleDebugClassesToCompileJar')
    def javaCompile = tasks.named('compileDebugJavaWithJavac')

    tasks.named('assembleSloth') {
        dependsOn slothClasses
        inputs.files(slothClasses.map { it.outputs.files }).withPropertyName('projectClasses')
        inputs.files(javaCompile.map { it.classpath }).withPropertyName('compileClasspath')
        inputs.files(android.bootClasspath).withPropertyName('androidBootClasspath')
        inputs.property('minApi', android.defaultConfig.minSdkVersion.apiLevel)

        setActions([])
        doLast {
            def outputFile = getOutputDir().file("${getBundleBaseName().get()}.jar").get().asFile
            java.nio.file.Files.deleteIfExists(outputFile.toPath())
            def command = com.android.tools.r8.D8Command.builder()
                    .addProgramFiles(slothClasses.get().outputs.files.singleFile.toPath())
                    .addClasspathFiles(javaCompile.get().classpath.files.collect { it.toPath() })
                    .addLibraryFiles(android.bootClasspath.collect { it.toPath() })
                    .setMinApiLevel(android.defaultConfig.minSdkVersion.apiLevel)
                    .setMode(com.android.tools.r8.CompilationMode.RELEASE)
                    .setOutput(outputFile.toPath(), com.android.tools.r8.OutputMode.DexIndexed)
                    .build()
            com.android.tools.r8.D8.run(command)
        }
    }
}
